name: Build installers (no release)

# Manually triggered (Actions tab -> "Build installers" -> Run workflow).
# Builds installers and uploads them as workflow artifacts for testing.
# Nothing is published.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "windows, macos, linux or all"
        default: "windows"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: windows
            platform: windows-latest
            args: ""
          - key: macos
            platform: macos-latest
            args: "--target universal-apple-darwin"
          - key: linux
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Skip?
        id: go
        shell: bash
        run: |
          p="${{ github.event.inputs.platforms }}"
          if [[ "$p" == "all" || "$p" == *"${{ matrix.key }}"* ]]; then echo "run=true" >> $GITHUB_OUTPUT; else echo "run=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.go.outputs.run == 'true'
      - name: Linux system deps
        if: steps.go.outputs.run == 'true' && matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        if: steps.go.outputs.run == 'true'
        with:
          targets: ${{ matrix.key == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        if: steps.go.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.go.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.go.outputs.run == 'true'
      - uses: tauri-apps/tauri-action@v0
        if: steps.go.outputs.run == 'true'
        with:
          args: ${{ matrix.args }}
      - run: cargo build --release -p tidydrop-cli
        if: steps.go.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.go.outputs.run == 'true'
        with:
          name: tidydrop-${{ matrix.key }}
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/release/tidydrop-cli
            target/release/tidydrop-cli.exe
          if-no-files-found: warn
