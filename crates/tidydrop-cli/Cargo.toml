[package]
name = "tidydrop-cli"
description = "Command-line interface for tidydrop."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tidydrop-cli"
path = "src/main.rs"

[dependencies]
tidydrop-core = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
